<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>貓咪餵藥日曆</title>
  <style>
    :root {
      --bg: #F8F7F4;
      --white: #FFFFFF;
      --border: #EEECEA;
      --text: #2C2C2C;
      --muted: #AAAAA5;
      --accent: #C4896A;
      --am: #E8A020;
      --pm: #7986CB;
      --undone: #D4D0CA;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--text);
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    /* ── Header ── */
    .header {
      padding: 28px 0 2px;
      text-align: center;
    }

    .cat-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      transition: opacity 0.15s;
    }

    .cat-name:hover { opacity: 0.65; }

    .header-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.4px;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 2px 12px;
    }

    .nav-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .nav-btn:hover { background: var(--border); color: var(--text); }

    .month-label {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    /* ── Weekday row ── */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 5px;
    }
    .wd {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 3px 0;
    }
    .wd:first-child { color: #D07070; }
    .wd:last-child  { color: #7090D0; }

    /* ── Calendar grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cell {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 5px 2px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 70px;
      transition: border-color 0.15s;
    }
    .cell:hover { border-color: #CCC9C4; }

    .cell.empty {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }

    .cell.is-today {
      border-color: var(--accent);
      background: #FEF8F4;
    }

    .day-num {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1;
    }
    .cell.is-today .day-num {
      color: var(--accent);
      font-weight: 700;
    }

    .cats {
      display: flex;
      flex-direction: column;
      gap: 1px;
      align-items: center;
    }

    .cat-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 1px;
      border-radius: 5px;
      line-height: 0;
      transition: transform 0.12s;
    }
    .cat-btn:hover  { transform: scale(1.22); }
    .cat-btn:active { transform: scale(0.88); }

    .cat-icon { display: block; width: 24px; height: 24px; }

    @media (max-width: 360px) {
      .cat-icon { width: 20px; height: 20px; }
      .cell { min-height: 62px; gap: 1px; }
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 12px 0 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      margin-top: 10px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sync-info {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      flex: 1;
    }

    .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .refresh-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: var(--border); color: var(--text); }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .setup-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .setup-btn:hover { opacity: 0.82; }

    /* ── Overlay / bottom sheet ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 18px 22px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .sheet h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-input {
      display: block;
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s, background 0.15s;
    }
    .field-input:focus { border-color: var(--accent); background: white; }

    .steps {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .steps-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .steps ol {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .steps li {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .steps b { color: var(--text); }
    .steps code {
      background: #E6E2DB;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: monospace;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .btn-cancel {
      flex: 1;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #DDD9D3; }
    .btn-save {
      flex: 2;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }
  </style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="cat-name" id="catName" onclick="openSetup()" title="點擊設定">
      <span id="catNameText">小貓咪</span>
    </div>
    <div class="header-sub">每日餵藥記錄</div>
  </div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="weekdays">
    <div class="wd">日</div>
    <div class="wd">一</div>
    <div class="wd">二</div>
    <div class="wd">三</div>
    <div class="wd">四</div>
    <div class="wd">五</div>
    <div class="wd">六</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>

  <div class="bottom-bar">
    <div class="sync-info" id="syncInfo">尚未設定同步</div>
    <div class="bar-actions">
      <button class="refresh-btn" id="refreshBtn" onclick="syncAll()" title="重新同步">↻</button>
      <button class="setup-btn" onclick="openSetup()">設定</button>
    </div>
  </div>

</div>

<!-- Bottom sheet -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2>設定</h2>

    <label class="field-label" for="inputName">貓咪名字</label>
    <input class="field-input" type="text" id="inputName" placeholder="例：橘子、豆豆、咪咪" maxlength="20">

    <label class="field-label" for="inputUrl">Google Drive 同步網址（選填）</label>
    <input class="field-input" type="url" id="inputUrl" placeholder="https://script.google.com/macros/s/…/exec">

    <div class="steps">
      <div class="steps-title">如何設定 Google Drive 同步</div>
      <ol>
        <li>到 <b>Google Drive</b> 新增一個 Google 試算表</li>
        <li>開啟試算表，點「<b>擴充功能</b>」→「<b>Apps Script</b>」</li>
        <li>清空編輯器，貼上 <code>apps-script.gs</code> 的程式碼並儲存</li>
        <li>點「<b>部署</b>」→「<b>新增部署作業</b>」→ 類型選「<b>網頁應用程式</b>」</li>
        <li>執行身分：<b>我</b>，存取權：<b>所有人</b>，按「<b>部署</b>」並授權</li>
        <li>複製產生的「<b>網頁應用程式網址</b>」貼到上方欄位</li>
        <li>把這個 <code>index.html</code> 傳給家人，同樣貼上網址即可共用</li>
      </ol>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSetup()">取消</button>
      <button class="btn-save" onclick="saveSetup()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
var C_UNDONE = '#D4D0CA';
var C_AM     = '#E8A020';
var C_PM     = '#7986CB';

// ── State ─────────────────────────────────────────────────────────────────────
var curYear, curMonth;
var records   = {};   // { 'YYYY-MM-DD': { am: bool, pm: bool } }
var scriptUrl = '';
var catName   = '小貓咪';

// ── Cat SVG ───────────────────────────────────────────────────────────────────
function catSVG(color) {
  // Two ear triangles + circular head; eyes + nose drawn on top
  var e = 'rgba(255,255,255,0.6)'; // eye whites
  var p = 'rgba(0,0,0,0.28)';      // pupils
  var n = 'rgba(0,0,0,0.18)';      // nose
  var m = 'rgba(0,0,0,0.12)';      // mouth
  return [
    '<svg class="cat-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">',
    // Left ear
    '<polygon points="3,18 10,5 16,18" fill="',color,'"/>',
    // Right ear
    '<polygon points="16,18 22,5 29,18" fill="',color,'"/>',
    // Head
    '<circle cx="16" cy="22" r="11" fill="',color,'"/>',
    // Left eye white
    '<ellipse cx="12" cy="20" rx="2.2" ry="2.6" fill="',e,'"/>',
    // Right eye white
    '<ellipse cx="20" cy="20" rx="2.2" ry="2.6" fill="',e,'"/>',
    // Left pupil
    '<ellipse cx="12" cy="20.6" rx="1.1" ry="1.7" fill="',p,'"/>',
    // Right pupil
    '<ellipse cx="20" cy="20.6" rx="1.1" ry="1.7" fill="',p,'"/>',
    // Nose triangle
    '<path d="M14.8 24.5 L17.2 24.5 L16 26.2 Z" fill="',n,'"/>',
    // Smile
    '<path d="M14.2 27 Q16 28.8 17.8 27" stroke="',m,'" stroke-width="0.9" fill="none" stroke-linecap="round"/>',
    '</svg>'
  ].join('');
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }

function toKey(y, m, d) {
  return y + '-' + pad(m+1) + '-' + pad(d);
}

function nowKey() {
  var t = new Date();
  return toKey(t.getFullYear(), t.getMonth(), t.getDate());
}

// ── Render calendar ───────────────────────────────────────────────────────────
var MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function render() {
  document.getElementById('monthLabel').textContent = curYear + ' 年 ' + MONTH_NAMES[curMonth];

  var today = nowKey();
  var firstDow = new Date(curYear, curMonth, 1).getDay();
  var days     = new Date(curYear, curMonth + 1, 0).getDate();
  var html = '';

  for (var i = 0; i < firstDow; i++) {
    html += '<div class="cell empty"></div>';
  }

  for (var d = 1; d <= days; d++) {
    var key  = toKey(curYear, curMonth, d);
    var rec  = records[key] || {};
    var amOk = !!rec.am;
    var pmOk = !!rec.pm;
    var cls  = 'cell' + (key === today ? ' is-today' : '');

    html += '<div class="' + cls + '">';
    html += '<span class="day-num">' + d + '</span>';
    html += '<div class="cats">';
    html += '<button class="cat-btn" onclick="toggle(\'' + key + '\',\'am\')" title="早上餵藥">' + catSVG(amOk ? C_AM : C_UNDONE) + '</button>';
    html += '<button class="cat-btn" onclick="toggle(\'' + key + '\',\'pm\')" title="晚上餵藥">' + catSVG(pmOk ? C_PM : C_UNDONE) + '</button>';
    html += '</div></div>';
  }

  document.getElementById('grid').innerHTML = html;

  // Legend
  document.getElementById('legend').innerHTML =
    '<div class="legend-item">' + catSVG(C_AM) + '<span>早上</span></div>' +
    '<div class="legend-item">' + catSVG(C_PM) + '<span>晚上</span></div>' +
    '<div class="legend-item">' + catSVG(C_UNDONE) + '<span>未餵</span></div>';
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

// ── Toggle ────────────────────────────────────────────────────────────────────
function toggle(key, period) {
  if (!records[key]) records[key] = { am: false, pm: false };
  records[key][period] = !records[key][period];
  saveLocal();
  render();
  if (scriptUrl) pushToggle(key, period, records[key][period]);
}

function saveLocal() {
  try { localStorage.setItem('catMedRec', JSON.stringify(records)); } catch(e) {}
}

// ── Sync ──────────────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById('syncInfo').textContent = msg;
}

function spinning(on) {
  var btn = document.getElementById('refreshBtn');
  if (on) btn.classList.add('spinning');
  else    btn.classList.remove('spinning');
}

// JSONP 方式讀取資料，解決手機瀏覽器（尤其 iOS Safari）的 CORS 限制
function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    var cbName = '_catcb' + Date.now() + Math.floor(Math.random() * 9999);
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      cleanup();
      reject(new Error('timeout'));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('script load error'));
    };

    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

async function syncAll() {
  if (!scriptUrl) { setStatus('尚未設定同步網址'); return; }
  spinning(true);
  setStatus('同步中…');
  try {
    // 使用 JSONP 確保手機瀏覽器也能跨域讀取
    var data = await jsonpFetch(scriptUrl + '?action=getAll');
    // Merge strategy: true wins (don't erase a "given" record)
    for (var k in data) {
      if (!records[k]) records[k] = { am: false, pm: false };
      records[k].am = records[k].am || !!data[k].am;
      records[k].pm = records[k].pm || !!data[k].pm;
    }
    saveLocal();
    render();
    var t = new Date();
    setStatus('已同步  ' + pad(t.getHours()) + ':' + pad(t.getMinutes()));
  } catch(e) {
    setStatus('同步失敗（使用本地資料）');
  }
  spinning(false);
}

async function pushToggle(key, period, value) {
  var url = scriptUrl + '?action=set&date=' + key + '&period=' + period + '&value=' + (value ? '1' : '0');
  var attempts = 3;
  for (var i = 0; i < attempts; i++) {
    try {
      var res = await jsonpFetch(url);
      if (res && res.ok) {
        var t = new Date();
        setStatus('已同步  ' + pad(t.getHours()) + ':' + pad(t.getMinutes()));
        return;
      }
    } catch(e) {}
    if (i < attempts - 1) await new Promise(function(r){ setTimeout(r, 1500); });
  }
  setStatus('寫入失敗，請按重新整理');
}

// ── Setup sheet ───────────────────────────────────────────────────────────────
function openSetup() {
  document.getElementById('inputName').value = catName;
  document.getElementById('inputUrl').value  = scriptUrl;
  document.getElementById('overlay').classList.add('open');
}

function closeSetup() {
  document.getElementById('overlay').classList.remove('open');
}

function overlayBg(e) {
  if (e.target === document.getElementById('overlay')) closeSetup();
}

function saveSetup() {
  var name = document.getElementById('inputName').value.trim();
  var url  = document.getElementById('inputUrl').value.trim();

  catName   = name || '小貓咪';
  scriptUrl = url;

  document.getElementById('catNameText').textContent = catName;

  try {
    localStorage.setItem('catMedName', catName);
    localStorage.setItem('catMedUrl',  scriptUrl);
  } catch(e) {}

  closeSetup();

  if (scriptUrl) {
    syncAll();
  } else {
    setStatus('尚未設定同步網址');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  var now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth();

  try {
    var saved = localStorage.getItem('catMedRec');
    records   = saved ? JSON.parse(saved) : {};
    catName   = localStorage.getItem('catMedName') || '小貓咪';
    scriptUrl = localStorage.getItem('catMedUrl')  || '';
  } catch(e) { records = {}; }

  document.getElementById('catNameText').textContent = catName;
  render();

  if (scriptUrl) {
    setStatus('連線中…');
    syncAll();
  }

  // 切回 app 時自動同步
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && scriptUrl) syncAll();
  });
})();
</script>
</body>
</html>
