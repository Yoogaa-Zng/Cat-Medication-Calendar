<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貓咪餵藥日曆</title>
  <style>
    /* ── Design tokens ──
       強調色分兩階：--accent 只給邊框與光暈（裝飾），--accent-strong 給文字與實心按鈕（過 4.5:1）。
       所有顏色都走變數，深色模式只需要在下面的 @media 換一組值。 */
    :root {
      color-scheme: light dark;
      --bg: #F8F7F4;
      --white: #FFFFFF;
      --border: #EEECEA;
      --text: #2C2C2C;
      --muted: #6B6B66;
      --accent: #C4896A;
      --accent-strong: #9E5A41;
      --on-accent: #FFFFFF;
      --am: #C97C00;
      --pm: #6573C0;
      --undone: #B3AEA6;
      --vomit: #BC4A38;
      --pant: #2B7F83;
      --missed-bg: #FCEFE9;
      --missed-border: #F0D2C4;
      --today-bg: #FEF8F4;
      --am-soft: #FFF4E0;
      --pm-soft: #EEF0FB;
      --avatar-bg: #F3E4DA;
      --avatar-glow: rgba(158,90,65,0.22);
      --wd-sun: #B24C4C;
      --wd-sat: #4A69B2;
      --hover-border: #CCC9C4;
      --code-bg: #E6E2DB;
      --btn-hover: #DDD9D3;
      --toast-bg: #2C2C2C;
      --toast-fg: #FFFFFF;
      --toast-action: #F2C9B0;
      --scrim: rgba(0,0,0,0.3);
      --ok: #3E8E5A;
      --err: #B8432F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1B1917;
        --white: #26231F;
        --border: #37332E;
        --text: #F1EDE7;
        --muted: #AAA59D;
        --accent: #E0A98C;
        --accent-strong: #E0A98C;
        --on-accent: #1B1917;
        --am: #E8A020;
        --pm: #97A3E6;
        --undone: #6B655C;
        --vomit: #B8432F;
        --pant: #2B7F83;
        --missed-bg: #3A2822;
        --missed-border: #5E4036;
        --today-bg: #2E2520;
        --am-soft: #3A2E14;
        --pm-soft: #262A44;
        --avatar-bg: #E6D5C3;
        --avatar-glow: rgba(224,169,140,0.25);
        --wd-sun: #E08585;
        --wd-sat: #8FA6E6;
        --hover-border: #4A453F;
        --code-bg: #37332E;
        --btn-hover: #37332E;
        --toast-bg: #F1EDE7;
        --toast-fg: #1B1917;
        --toast-action: #9E5A41;
        --scrim: rgba(0,0,0,0.6);
        --ok: #6FBF8A;
        --err: #F08A76;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--text);
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 26px 0 0;
      text-align: center;
    }

    .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--avatar-bg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 3px var(--white), 0 4px 14px var(--avatar-glow);
    }
    .avatar svg { display: block; width: 50px; height: 50px; }

    .cat-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      transition: opacity 0.15s;
    }

    .cat-name:hover { opacity: 0.65; }

    /* 今日進度：打開 App 的第一句話 */
    .header-sub {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 3px 13px;
      letter-spacing: 0.2px;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: flex-start;   /* 箭頭對齊月份文字，不受下方「回到今天」影響 */
      justify-content: space-between;
      padding: 20px 2px 0;
    }

    .nav-btn {
      margin-top: -10px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .nav-btn:hover { background: var(--border); color: var(--text); }

    .month-center { text-align: center; }

    .month-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .today-link {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--accent-strong);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      visibility: hidden;   /* 用 visibility 保留高度，避免切月時版面跳動 */
    }
    .today-link.show { visibility: visible; }

    /* ── 今天卡片 ── */
    .today {
      margin-top: 18px;
      background: var(--white);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 14px;
    }
    .today-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .today-title { font-size: 16px; font-weight: 700; }
    .today-date  { font-size: 12.5px; color: var(--muted); }

    .doses, .symacts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .symacts { margin-top: 10px; }

    .dose-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-height: 100px;
      padding: 10px 6px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
    }
    .dose-btn:active { transform: scale(0.97); }
    .dose-btn .cat-icon { width: 44px; height: 44px; }
    .dose-label { font-size: 14px; font-weight: 600; }
    .dose-state { font-size: 12px; color: var(--muted); }
    .dose-btn.on .dose-state { color: var(--text); font-weight: 600; }
    .dose-btn.on.am { border-color: var(--am); background: var(--am-soft); }
    .dose-btn.on.pm { border-color: var(--pm); background: var(--pm-soft); }

    .sym-act {
      min-height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .sym-act:active { transform: scale(0.97); }
    .sym-act.on { color: #FFFFFF; }
    .sym-act.on.vomit { background: var(--vomit); border-color: var(--vomit); }
    .sym-act.on.pant  { background: var(--pant);  border-color: var(--pant); }

    .dose-btn:focus-visible, .sym-act:focus-visible, .cell:focus-visible,
    .today-link:focus-visible, .toast button:focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }

    /* ── Weekday row ── */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 5px;
    }
    .wd {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 3px 0;
    }
    .wd:first-child { color: var(--wd-sun); }
    .wd:last-child  { color: var(--wd-sat); }

    /* ── Calendar grid ──
       原則：「有」是實心、「沒有」是空心輪廓；還沒到的日子只留日期。 */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .cell {
      background: var(--white);
      border: 1.5px solid transparent;
      box-shadow: 0 1px 0 rgba(0,0,0,0.035);
      border-radius: 12px;
      padding: 5px 2px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 96px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cell:hover { border-color: var(--hover-border); }

    .cell.empty {
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .cell.is-today {
      border-color: var(--accent);
      background: var(--today-bg);
    }

    /* 過去、起始日之後、有一餐沒記錄 → 淡橘底，一眼看出漏記 */
    .cell.is-missed {
      background: var(--missed-bg);
      border-color: var(--missed-border);
    }

    /* 還沒到的日子：不畫任何空圖示，整排自動變矮 */
    .cell.is-future {
      background: transparent;
      box-shadow: none;
      min-height: 40px;
    }
    .cell.is-future .cats,
    .cell.is-future .syms { display: none; }

    .day-num {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1;
    }
    .cell.is-today .day-num {
      color: var(--on-accent);
      background: var(--accent-strong);
      width: 19px; height: 19px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      margin: -2px 0 1px;
    }

    .cats {
      display: flex;
      flex-direction: column;
      gap: 1px;
      align-items: center;
    }

    /* 格子內的圖示只負責顯示；操作統一在「今天」卡片與點格子後的面板 */
    .cat-mark { padding: 1px; line-height: 0; }

    /* ── 貓貓圖示 ──
       有餵＝實心（虎斑紋、耳內粉色）；沒餵＝只有輪廓。
       早上睜眼、晚上瞇眼睡覺，早晚不只靠顏色分辨。 */
    .cat-icon { display: block; width: 24px; height: 24px; }
    .cat-icon.cat-am { --fur: var(--am); }
    .cat-icon.cat-pm { --fur: var(--pm); }
    .cat-icon .fur   { fill: var(--fur); stroke: var(--fur); stroke-width: 1.6; stroke-linejoin: round; }
    .cat-icon .inner { fill: rgba(255,255,255,0.4); }
    .cat-icon .stripe { fill: none; stroke: rgba(0,0,0,0.28); stroke-width: 1.3; stroke-linecap: round; }
    .cat-icon .eye   { fill: #2B2119; }
    .cat-icon .glint { fill: #FFFFFF; }
    .cat-icon .shut  { fill: none; stroke: #2B2119; stroke-width: 1.3; stroke-linecap: round; }
    .cat-icon .nose  { fill: rgba(43,33,25,0.55); stroke: rgba(43,33,25,0.55); stroke-width: 0.6; stroke-linejoin: round; }
    .cat-icon .mouth { fill: none; stroke: rgba(43,33,25,0.5); stroke-width: 0.8; stroke-linecap: round; }

    .cat-icon.empty .fur   { fill: none; stroke: var(--undone); stroke-width: 1.5; }
    .cat-icon.empty .inner,
    .cat-icon.empty .stripe,
    .cat-icon.empty .glint { display: none; }
    .cat-icon.empty .eye   { fill: var(--undone); }
    .cat-icon.empty .shut  { stroke: var(--undone); }
    .cat-icon.empty .nose  { fill: var(--undone); stroke: var(--undone); }
    .cat-icon.empty .mouth { stroke: var(--undone); }

    /* ── Symptom dots：沒有＝空心圈，有＝實心 ── */
    .syms {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .sym-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--undone);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 7.5px;
      font-weight: 700;
      color: var(--undone);
      transition: background 0.15s;
    }
    .sym-vomit { background: var(--vomit); border-color: var(--vomit); color: #FFFFFF; }
    .sym-pant  { background: var(--pant);  border-color: var(--pant);  color: #FFFFFF; }

    @media (max-width: 360px) {
      .cat-icon { width: 20px; height: 20px; }
      .cell { min-height: 84px; gap: 1px; }
      .sym-dot { width: 16px; height: 16px; font-size: 6.5px; }
    }

    /* ── Legend ──
       6 個項目要排進同一行：圖示縮小、間距收窄、文字不換行。
       極窄螢幕（≤340px）改成 3×2 的整齊兩排，避免單一項目落單 */
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      padding: 12px 0 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .legend-item .cat-icon { width: 20px; height: 20px; }
    .legend-dot {
      width: 16px; height: 16px;
      font-size: 7.5px;
      display: inline-flex;
    }
    .legend-missed {
      width: 14px; height: 14px;
      border-radius: 4px;
      background: var(--missed-bg);
      border: 1.5px solid var(--missed-border);
    }
    @media (max-width: 340px) {
      .legend { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 8px 14px; }
    }

    /* ── Bottom bar：設定是低頻操作，退到次要 ── */
    .bottom-bar {
      margin-top: 10px;
      padding: 4px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sync-info {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      flex: 1;
    }
    .sync-dot {
      flex-shrink: 0;
      width: 8px; height: 8px;
      margin-top: 0.42em;
      border-radius: 50%;
      background: var(--undone);
    }
    .sync-dot.ok   { background: var(--ok); }
    .sync-dot.err  { background: var(--err); }
    .sync-dot.busy { background: var(--accent); }
    .sync-info.err { color: var(--err); }

    .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .refresh-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: var(--border); color: var(--text); }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .setup-btn {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    .setup-btn:hover { background: var(--border); color: var(--text); }

    /* ── Overlay / bottom sheet ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 18px 22px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .sheet h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-input {
      display: block;
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s, background 0.15s;
    }
    .field-input:focus { border-color: var(--accent-strong); background: var(--white); }

    .steps {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .steps-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .steps ol {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .steps li {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    .steps b { color: var(--text); }
    .steps code {
      background: var(--code-bg);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: monospace;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .btn-cancel {
      flex: 1;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--btn-hover); }
    .btn-save {
      flex: 2;
      background: var(--accent-strong);
      color: var(--on-accent);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }

    /* ── Toast（記錄後的回饋＋復原） ── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      max-width: calc(100% - 28px);
      background: var(--toast-bg);
      color: var(--toast-fg);
      border-radius: 12px;
      padding: 8px 8px 8px 16px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 60;
    }
    .toast.show { opacity: 1; pointer-events: all; transform: translate(-50%, 0); }
    .toast button {
      background: none;
      border: none;
      color: var(--toast-action);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 10px;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="cat-name" id="catName" onclick="openSetup()" title="點擊設定">
      <span id="catNameText">小貓咪</span>
    </div>
    <div class="header-sub" id="headerSub" role="status"></div>
  </div>

  <div class="today" id="today"></div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)" aria-label="上個月">‹</button>
    <div class="month-center">
      <div class="month-label" id="monthLabel"></div>
      <button class="today-link" id="todayLink" onclick="goToday()">回到今天</button>
    </div>
    <button class="nav-btn" onclick="changeMonth(1)" aria-label="下個月">›</button>
  </div>

  <div class="weekdays">
    <div class="wd">日</div>
    <div class="wd">一</div>
    <div class="wd">二</div>
    <div class="wd">三</div>
    <div class="wd">四</div>
    <div class="wd">五</div>
    <div class="wd">六</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>

  <div class="bottom-bar">
    <div class="sync-info" id="syncInfo" role="status" aria-live="polite">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">尚未設定同步</span>
    </div>
    <div class="bar-actions">
      <button class="refresh-btn" id="refreshBtn" onclick="syncAll()" title="重新同步">↻</button>
      <button class="setup-btn" onclick="openSetup()">設定</button>
    </div>
  </div>

</div>

<!-- 某一天的紀錄面板（點月曆格子打開） -->
<div class="overlay" id="dayOverlay" onclick="dayBg(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="dayTitle"></h2>
    <div id="dayBody"></div>
    <div class="sheet-actions" style="margin-top:18px">
      <button class="btn-save" onclick="closeDay()">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo" onclick="undoLast()">復原</button>
</div>

<!-- Bottom sheet -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2>設定</h2>

    <label class="field-label" for="inputName">貓咪名字</label>
    <input class="field-input" type="text" id="inputName" placeholder="例：橘子、豆豆、咪咪" maxlength="20">

    <label class="field-label" for="inputUrl">Google Drive 同步網址（選填）</label>
    <input class="field-input" type="url" id="inputUrl" placeholder="https://script.google.com/macros/s/…/exec">

    <div class="steps">
      <div class="steps-title">如何設定 Google Drive 同步</div>
      <ol>
        <li>到 <b>Google Drive</b> 新增一個 Google 試算表</li>
        <li>開啟試算表，點「<b>擴充功能</b>」→「<b>Apps Script</b>」</li>
        <li>清空編輯器，貼上 <code>apps-script.gs</code> 的程式碼並儲存</li>
        <li>點「<b>部署</b>」→「<b>新增部署作業</b>」→ 類型選「<b>網頁應用程式</b>」</li>
        <li>執行身分：<b>我</b>，存取權：<b>所有人</b>，按「<b>部署</b>」並授權</li>
        <li>複製產生的「<b>網頁應用程式網址</b>」貼到上方欄位</li>
        <li>把這個網頁的網址傳給家人，他們同樣在這裡貼上同步網址即可共用</li>
      </ol>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSetup()">取消</button>
      <button class="btn-save" onclick="saveSetup()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
var PERIOD_LABEL = { am: '早上餵藥', pm: '晚上餵藥', vomit: '嘔吐', pant: '喘氣' };
var WEEKDAYS     = ['日','一','二','三','四','五','六'];

// ── State ─────────────────────────────────────────────────────────────────────
var curYear, curMonth;
var records   = {};   // { 'YYYY-MM-DD': { am, pm, vomit, pant } }
var pending   = {};   // 還沒被 server 確認的本地修改：{ 'YYYY-MM-DD|period': bool }
var scriptUrl = '';
var catName   = '小貓咪';
var openDayKey = null;

// ── Cat SVG ───────────────────────────────────────────────────────────────────
// 貓咪圖示：有餵＝實心虎斑貓，沒餵＝只有輪廓；早上睜眼、晚上瞇眼睡覺
// 顏色全部走 CSS 變數（.cat-icon），所以深色模式不需要在這裡處理
function catSVG(period, done) {
  var eyes = (period === 'am')
    ? '<ellipse class="eye" cx="11.4" cy="19" rx="1.5" ry="1.9"/><ellipse class="eye" cx="20.6" cy="19" rx="1.5" ry="1.9"/>' +
      '<circle class="glint" cx="11.9" cy="18.2" r="0.55"/><circle class="glint" cx="21.1" cy="18.2" r="0.55"/>'
    : '<path class="shut" d="M9.7 19.2 Q11.4 21.2 13.1 19.2"/><path class="shut" d="M18.9 19.2 Q20.6 21.2 22.3 19.2"/>';
  return '<svg class="cat-icon cat-' + period + (done ? '' : ' empty') + '" viewBox="0 0 32 32" aria-hidden="true">' +
    '<path class="fur" d="M4.1 18 L6.5 3.8 L14 9.2 Q16 8.7 18 9.2 L25.5 3.8 L27.9 18 A12 10.5 0 1 1 4.1 18 Z"/>' +
    '<path class="inner" d="M7.2 14 L7.9 7.4 L12 10.6 Z"/><path class="inner" d="M24.8 14 L24.1 7.4 L20 10.6 Z"/>' +
    '<path class="stripe" d="M16 10.6 L16 14.2 M12.6 11.4 L13.2 14 M19.4 11.4 L18.8 14 M4.9 19.6 L8.2 20 M5.6 23.2 L8.6 22.8 M27.1 19.6 L23.8 20 M26.4 23.2 L23.4 22.8"/>' +
    eyes +
    '<path class="nose" d="M14.9 22.9 L17.1 22.9 L16 24.2 Z"/>' +
    '<path class="mouth" d="M16 24.2 L16 25.2 M16 25.2 Q14.9 26.2 13.9 25.7 M16 25.2 Q17.1 26.2 18.1 25.7"/>' +
    '</svg>';
}

// 標題的虎斑貓頭像：兩餐都餵完時眼睛會瞇起來（滿足的表情）
function tabbyAvatar(happy) {
  var eyes = happy
    ? '<path d="M18.2 34.8 Q22.5 39.2 26.8 34.8 M37.2 34.8 Q41.5 39.2 45.8 34.8" fill="none" stroke="#2B2119" stroke-width="2.4" stroke-linecap="round"/>'
    : '<ellipse cx="22.5" cy="34" rx="4" ry="4.6" fill="#D9A33A"/><ellipse cx="41.5" cy="34" rx="4" ry="4.6" fill="#D9A33A"/>' +
      '<ellipse cx="22.5" cy="34" rx="1.5" ry="3.6" fill="#2B2119"/><ellipse cx="41.5" cy="34" rx="1.5" ry="3.6" fill="#2B2119"/>' +
      '<circle cx="23.9" cy="32.2" r="1.1" fill="#FFFFFF"/><circle cx="42.9" cy="32.2" r="1.1" fill="#FFFFFF"/>';
  return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<path d="M10 31 L12 8 L28 20 Z M54 31 L52 8 L36 20 Z" fill="#8C6A48" stroke="#8C6A48" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M14.5 24.5 L15 14 L22.5 19.5 Z M49.5 24.5 L49 14 L41.5 19.5 Z" fill="#C9958A"/>' +
    '<ellipse cx="32" cy="36" rx="24" ry="21" fill="#8C6A48"/>' +
    '<g fill="none" stroke="#241810" stroke-linecap="round">' +
      '<path d="M32 16 L32 25 M25 17.5 L26.5 24 M39 17.5 L37.5 24" stroke-width="2.6"/>' +
      '<path d="M9 34 L16.5 35.5 M9.5 40 L16.5 40 M55 34 L47.5 35.5 M54.5 40 L47.5 40" stroke-width="2.4"/>' +
    '</g>' +
    '<ellipse cx="32" cy="43.5" rx="10.5" ry="7.5" fill="#CDB08C"/>' +
    eyes +
    '<path d="M29.3 40 L34.7 40 L32 43.2 Z" fill="#B97A72" stroke="#B97A72" stroke-width="1" stroke-linejoin="round"/>' +
    '<path d="M32 43.2 L32 45.8 M32 45.8 Q29.6 48.8 27 46.6 M32 45.8 Q34.4 48.8 37 46.6" fill="none" stroke="#5A3A2C" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M21 42 L9 40.5 M21 45 L10 47 M43 42 L55 40.5 M43 45 L54 47" fill="none" stroke="rgba(241,230,214,0.85)" stroke-width="1.2" stroke-linecap="round"/>' +
    '</svg>';
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }

function toKey(y, m, d) {
  return y + '-' + pad(m+1) + '-' + pad(d);
}

function nowKey() {
  var t = new Date();
  return toKey(t.getFullYear(), t.getMonth(), t.getDate());
}

// 'YYYY-MM-DD' → '10月6日（二）'
function dateLabel(key) {
  var p = key.split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEKDAYS[d.getDay()] + '）';
}

// 有紀錄以來的第一天；在這之前的日子不算「漏記」
function firstRecordKey() {
  var first = null;
  for (var k in records) {
    if ((records[k].am || records[k].pm) && (!first || k < first)) first = k;
  }
  return first;
}

// ── Render calendar ───────────────────────────────────────────────────────────
var MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function render() {
  document.getElementById('monthLabel').textContent = curYear + ' 年 ' + MONTH_NAMES[curMonth];

  var today    = nowKey();
  var firstRec = firstRecordKey();
  var firstDow = new Date(curYear, curMonth, 1).getDay();
  var days     = new Date(curYear, curMonth + 1, 0).getDate();
  var html = '';

  for (var i = 0; i < firstDow; i++) {
    html += '<div class="cell empty"></div>';
  }

  for (var d = 1; d <= days; d++) {
    var key  = toKey(curYear, curMonth, d);
    var rec     = records[key] || {};
    var amOk    = !!rec.am;
    var pmOk    = !!rec.pm;
    var vomitOk = !!rec.vomit;
    var pantOk  = !!rec.pant;
    var cls  = 'cell';
    if (key === today) cls += ' is-today';
    if (key > today)   cls += ' is-future';
    if (key < today && firstRec && key >= firstRec && !(amOk && pmOk)) cls += ' is-missed';

    var label = dateLabel(key) + '，早上' + (amOk ? '已餵' : '沒有記錄') + '，晚上' + (pmOk ? '已餵' : '沒有記錄') +
                (vomitOk ? '，有嘔吐' : '') + (pantOk ? '，有喘氣' : '');

    html += '<div class="' + cls + '" role="button" tabindex="0" aria-label="' + label + '"' +
            ' onclick="openDay(\'' + key + '\')" onkeydown="cellKey(event,\'' + key + '\')">';
    html += '<span class="day-num">' + d + '</span>';
    html += '<div class="cats">';
    html += '<span class="cat-mark">' + catSVG('am', amOk) + '</span>';
    html += '<span class="cat-mark">' + catSVG('pm', pmOk) + '</span>';
    html += '</div>';
    html += '<div class="syms">';
    html += '<div class="sym-dot' + (vomitOk ? ' sym-vomit' : '') + '">吐</div>';
    html += '<div class="sym-dot' + (pantOk ? ' sym-pant' : '') + '">喘</div>';
    html += '</div>';
    html += '</div>';
  }

  document.getElementById('grid').innerHTML = html;

  // 不在當月時，顯示「回到今天」
  var t = new Date();
  var onThisMonth = (curYear === t.getFullYear() && curMonth === t.getMonth());
  document.getElementById('todayLink').classList.toggle('show', !onThisMonth);

  // Legend
  document.getElementById('legend').innerHTML =
    '<div class="legend-item">' + catSVG('am', true) + '<span>早上</span></div>' +
    '<div class="legend-item">' + catSVG('pm', true) + '<span>晚上</span></div>' +
    '<div class="legend-item">' + catSVG('am', false) + '<span>未餵</span></div>' +
    '<div class="legend-item"><div class="sym-dot sym-vomit legend-dot">吐</div><span>嘔吐</span></div>' +
    '<div class="legend-item"><div class="sym-dot sym-pant legend-dot">喘</div><span>喘氣</span></div>' +
    '<div class="legend-item"><span class="legend-missed"></span><span>漏記</span></div>';
}

// 「今天」卡片與「某一天」面板共用同一組控制按鈕
function dayControls(key) {
  var rec  = records[key] || {};
  var past = key < nowKey();
  var none = past ? '沒有記錄' : '還沒餵';

  function dose(period, label) {
    var on = !!rec[period];
    return '<button class="dose-btn ' + period + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
           ' onclick="toggle(\'' + key + '\',\'' + period + '\')">' +
           catSVG(period, on) +
           '<span class="dose-label">' + label + '</span>' +
           '<span class="dose-state">' + (on ? '已餵 ✓' : none) + '</span></button>';
  }
  function sym(period, label) {
    var on = !!rec[period];
    return '<button class="sym-act ' + period + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
           ' onclick="toggle(\'' + key + '\',\'' + period + '\')">' + (on ? '✓ 有' + label : label) + '</button>';
  }

  return '<div class="doses">' + dose('am', '早上') + dose('pm', '晚上') + '</div>' +
         '<div class="symacts">' + sym('vomit', '嘔吐') + sym('pant', '喘氣') + '</div>';
}

function renderToday() {
  var key = nowKey();
  document.getElementById('today').innerHTML =
    '<div class="today-head"><span class="today-title">今天</span>' +
    '<span class="today-date">' + dateLabel(key) + '</span></div>' + dayControls(key);

  // 標題：今日進度 + 頭像表情（兩餐都餵完 → 眼睛瞇起來）
  var rec = records[key] || {};
  var n   = (rec.am ? 1 : 0) + (rec.pm ? 1 : 0);
  document.getElementById('headerSub').textContent =
    n === 2 ? '今天都餵好了 ✓' : n === 1 ? '今天已餵 1 / 2' : '今天還沒餵藥';
  document.getElementById('avatar').innerHTML = tabbyAvatar(n === 2);
}

function renderAll() {
  render();
  renderToday();
  if (openDayKey) renderDay();
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

function goToday() {
  var t = new Date();
  curYear = t.getFullYear();
  curMonth = t.getMonth();
  render();
}

// ── 某一天的面板 ──────────────────────────────────────────────────────────────
function openDay(key) {
  openDayKey = key;
  renderDay();
  document.getElementById('dayOverlay').classList.add('open');
}

function renderDay() {
  document.getElementById('dayTitle').textContent = dateLabel(openDayKey);
  document.getElementById('dayBody').innerHTML = dayControls(openDayKey);
}

function closeDay() {
  openDayKey = null;
  document.getElementById('dayOverlay').classList.remove('open');
}

function dayBg(e) {
  if (e.target === document.getElementById('dayOverlay')) closeDay();
}

function cellKey(e, key) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDay(key); }
}

// ── Toast：記錄後的回饋，附復原 ───────────────────────────────────────────────
var toastTimer = null;
var undoAction = null;

function showToast(msg, undo) {
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastUndo').style.display = undo ? '' : 'none';
  undoAction = undo || null;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4500);
}

function hideToast() {
  document.getElementById('toast').classList.remove('show');
  undoAction = null;
}

function undoLast() {
  var fn = undoAction;
  hideToast();
  if (fn) fn();
}

// ── Toggle ────────────────────────────────────────────────────────────────────
function toggle(key, period, silent) {
  if (!records[key]) records[key] = { am: false, pm: false, vomit: false, pant: false };
  var value = !records[key][period];
  records[key][period] = value;
  saveLocal();
  renderAll();

  if (!silent) {
    var when = key === nowKey() ? '' : dateLabel(key).split('（')[0] + ' ';
    showToast((value ? '已記錄　' : '已取消　') + when + PERIOD_LABEL[period], function() {
      toggle(key, period, true);
    });
  }

  if (scriptUrl) {
    // 先記成「待確認」，推送成功才清掉；中途同步或離線都不會讓這筆消失
    pending[key + '|' + period] = value;
    savePending();
    pushToggle(key, period, value);
  }
}

function saveLocal() {
  try { localStorage.setItem('catMedRec', JSON.stringify(records)); } catch(e) {}
}

function savePending() {
  try { localStorage.setItem('catMedPending', JSON.stringify(pending)); } catch(e) {}
}

// ── Sync ──────────────────────────────────────────────────────────────────────
// kind：'ok' 已同步／'err' 失敗／'busy' 進行中／省略 = 中性
function setStatus(msg, kind) {
  document.getElementById('syncText').textContent = msg;
  document.getElementById('syncDot').className  = 'sync-dot' + (kind ? ' ' + kind : '');
  document.getElementById('syncInfo').className = 'sync-info' + (kind === 'err' ? ' err' : '');
}

function spinning(on) {
  var btn = document.getElementById('refreshBtn');
  if (on) btn.classList.add('spinning');
  else    btn.classList.remove('spinning');
}

// JSONP 方式讀取資料，解決手機瀏覽器（尤其 iOS Safari）的 CORS 限制
function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    var cbName = '_catcb' + Date.now() + Math.floor(Math.random() * 9999);
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      cleanup();
      reject(new Error('timeout'));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('script load error'));
    };

    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

var pushCount  = 0;                  // 還在排隊或進行中的寫入數量
var pushQueue  = Promise.resolve();  // 寫入依點擊順序一筆一筆送，避免先後順序錯亂
var syncing    = false;
var syncAgain  = false;

function setUrl(key, period, value) {
  return scriptUrl + '?action=set&date=' + key + '&period=' + period + '&value=' + (value ? '1' : '0');
}

// 把還沒被 server 確認的本地修改，蓋回剛從 server 拿到的資料上
function applyPending() {
  for (var pk in pending) {
    var parts = pk.split('|');
    if (!records[parts[0]]) records[parts[0]] = { am: false, pm: false, vomit: false, pant: false };
    records[parts[0]][parts[1]] = pending[pk];
  }
}

// 補送之前沒送成功的修改（例如當時沒網路）；送不出去就留著，下次再試
async function flushPending() {
  var keys = Object.keys(pending);
  for (var i = 0; i < keys.length; i++) {
    var pk = keys[i], v = pending[pk], parts = pk.split('|');
    try {
      var res = await jsonpFetch(setUrl(parts[0], parts[1], v));
      if (res && res.ok && pending[pk] === v) delete pending[pk];
    } catch(e) { break; }
  }
  savePending();
}

function syncFailMessage(e) {
  if (!navigator.onLine) return '沒有網路。紀錄已存在手機，連線後會自動補上傳';
  if (e && String(e.message).indexOf('server:') === 0) return '試算表回傳錯誤（' + e.message.slice(7) + '），請到設定確認網址';
  return '連不上 Google 試算表，網址或權限可能失效。紀錄已存在手機，點 ↻ 重試';
}

async function syncAll() {
  if (!scriptUrl) { setStatus('尚未設定同步網址'); return; }
  if (pushCount > 0) { setStatus('寫入中，完成後自動同步…', 'busy'); return; }
  if (syncing) { syncAgain = true; return; }   // 同步進行中又被要求同步 → 結束後再跑一次
  syncing = true;
  spinning(true);
  setStatus('同步中…', 'busy');
  try {
    await flushPending();
    var serverData = await jsonpFetch(scriptUrl + '?action=getAll');
    if (!serverData || typeof serverData !== 'object' || serverData.error) {
      throw new Error('server:' + (serverData && serverData.error ? serverData.error : '格式不正確'));
    }

    // 第一次同步：server 是空的但本地有資料 → 把本地資料推上去
    var serverEmpty = Object.keys(serverData).length === 0;
    var localKeys = Object.keys(records);
    if (serverEmpty && localKeys.length > 0) {
      setStatus('上傳本地資料…', 'busy');
      for (var i = 0; i < localKeys.length; i++) {
        var k = localKeys[i];
        var rec = records[k];
        if (rec.am)    await pushOne(k, 'am', true);
        if (rec.pm)    await pushOne(k, 'pm', true);
        if (rec.vomit) await pushOne(k, 'vomit', true);
        if (rec.pant)  await pushOne(k, 'pant', true);
      }
      serverData = await jsonpFetch(scriptUrl + '?action=getAll');
      if (!serverData || typeof serverData !== 'object' || serverData.error) {
        throw new Error('server:' + (serverData && serverData.error ? serverData.error : '格式不正確'));
      }
    }

    // 以 server 為準，再把尚未確認的本地修改蓋回去
    records = {};
    for (var key in serverData) {
      records[key] = {
        am:    !!serverData[key].am,
        pm:    !!serverData[key].pm,
        vomit: !!serverData[key].vomit,
        pant:  !!serverData[key].pant
      };
    }
    applyPending();
    saveLocal();
    renderAll();

    var left = Object.keys(pending).length;
    if (left > 0) {
      setStatus(left + ' 筆紀錄尚未上傳，稍後自動重試', 'err');
    } else {
      var t = new Date();
      setStatus('已同步  ' + pad(t.getHours()) + ':' + pad(t.getMinutes()), 'ok');
    }
  } catch(e) {
    setStatus(syncFailMessage(e), 'err');
  }
  spinning(false);
  syncing = false;
  if (syncAgain) { syncAgain = false; syncAll(); }
}

async function pushOne(key, period, value) {
  try {
    await jsonpFetch(setUrl(key, period, value));
  } catch(e) {}
}

function pushToggle(key, period, value) {
  pushCount++;
  setStatus('寫入中…', 'busy');
  pushQueue = pushQueue.then(function() { return doPush(key, period, value); });
}

async function doPush(key, period, value) {
  var pk = key + '|' + period;
  var success = false;
  for (var i = 0; i < 3; i++) {
    try {
      var res = await jsonpFetch(setUrl(key, period, value));
      if (res && res.ok) { success = true; break; }
    } catch(e) {}
    if (i < 2) await new Promise(function(r){ setTimeout(r, 1500); });
  }
  pushCount--;

  if (success) {
    if (pending[pk] === value) { delete pending[pk]; savePending(); }   // 之後又改過就保留新的
    // 全部寫完後，從 server 確認一次，確保資料一致
    if (pushCount === 0) await syncAll();
  } else {
    // 寫入失敗：保留畫面上的狀態與待確認紀錄，連線恢復後自動補上傳
    if (pushCount === 0) {
      setStatus(navigator.onLine
        ? '寫入失敗，紀錄已存在手機，稍後自動重試'
        : '沒有網路。紀錄已存在手機，連線後會自動補上傳', 'err');
    }
  }
}

// ── Setup sheet ───────────────────────────────────────────────────────────────
function openSetup() {
  document.getElementById('inputName').value = catName;
  document.getElementById('inputUrl').value  = scriptUrl;
  document.getElementById('overlay').classList.add('open');
}

function closeSetup() {
  document.getElementById('overlay').classList.remove('open');
}

function overlayBg(e) {
  if (e.target === document.getElementById('overlay')) closeSetup();
}

function saveSetup() {
  var name = document.getElementById('inputName').value.trim();
  var url  = document.getElementById('inputUrl').value.trim();

  catName   = name || '小貓咪';
  scriptUrl = url;

  document.getElementById('catNameText').textContent = catName;

  try {
    localStorage.setItem('catMedName', catName);
    localStorage.setItem('catMedUrl',  scriptUrl);
  } catch(e) {}

  closeSetup();

  if (scriptUrl) {
    syncAll();
  } else {
    setStatus('尚未設定同步網址');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  var now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth();

  try {
    var saved = localStorage.getItem('catMedRec');
    records   = saved ? JSON.parse(saved) : {};
    catName   = localStorage.getItem('catMedName') || '小貓咪';
    scriptUrl = localStorage.getItem('catMedUrl')  || '';
    var savedPending = localStorage.getItem('catMedPending');
    pending = savedPending ? JSON.parse(savedPending) : {};
  } catch(e) { records = {}; pending = {}; }

  document.getElementById('catNameText').textContent = catName;
  renderAll();

  if (scriptUrl) {
    setStatus('連線中…', 'busy');
    syncAll();
  }

  // 切回 app、或網路恢復時自動同步（同時會補上傳先前沒送成功的紀錄）
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && scriptUrl) syncAll();
  });
  window.addEventListener('online', function() { if (scriptUrl) syncAll(); });

  // Esc 關閉面板
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    closeDay();
    closeSetup();
  });

  // 跨日時（App 一直開著）自動更新「今天」
  var shownDay = nowKey();
  setInterval(function() {
    if (nowKey() !== shownDay) { shownDay = nowKey(); renderAll(); }
  }, 60000);
})();
</script>
