<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貓咪餵藥日曆</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F8F7F4;
      --white: #FFFFFF;
      --border: #EEECEA;
      --text: #2C2C2C;
      --muted: #6B6B66;       /* 對比 5.0:1（底 #F8F7F4） */
      --accent: #C4896A;
      --am: #C97C00;          /* 圖形對比 3.3:1 */
      --pm: #6573C0;          /* 圖形對比 4.4:1 */
      --undone: #C4C0BA;
      --vomit: #BC4A38;       /* 白字對比 5.0:1 */
      --pant: #2B7F83;        /* 白字對比 4.7:1 */
      --missed-bg: #FCEFE9;
      --missed-border: #F0D2C4;
      --ok: #3E8E5A;
      --err: #B8432F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--text);
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    /* ── Header ── */
    .header {
      padding: 28px 0 2px;
      text-align: center;
    }

    .cat-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      transition: opacity 0.15s;
    }

    .cat-name:hover { opacity: 0.65; }

    .header-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.4px;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: flex-start;   /* 箭頭對齊月份文字，不受下方「回到今天」影響 */
      justify-content: space-between;
      padding: 20px 2px 0;
    }

    .nav-btn {
      margin-top: -10px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .nav-btn:hover { background: var(--border); color: var(--text); }

    .month-center { text-align: center; }

    .month-label {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .today-link {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      visibility: hidden;   /* 用 visibility 保留高度，避免切月時版面跳動 */
    }
    .today-link.show { visibility: visible; }

    /* ── 今天卡片 ── */
    .today {
      margin-top: 18px;
      background: var(--white);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 14px;
    }
    .today-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .today-title { font-size: 16px; font-weight: 700; }
    .today-date  { font-size: 12.5px; color: var(--muted); }

    .doses, .symacts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .symacts { margin-top: 10px; }

    .dose-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-height: 100px;
      padding: 10px 6px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
    }
    .dose-btn:active { transform: scale(0.97); }
    .dose-btn .cat-icon { width: 42px; height: 42px; }
    .dose-label { font-size: 14px; font-weight: 600; }
    .dose-state { font-size: 12px; color: var(--muted); }
    .dose-btn.on .dose-state { color: var(--text); font-weight: 600; }
    .dose-btn.on.am { border-color: var(--am); background: #FFF4E0; }
    .dose-btn.on.pm { border-color: var(--pm); background: #EEF0FB; }

    .sym-act {
      min-height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .sym-act:active { transform: scale(0.97); }
    .sym-act.on { color: #FFFFFF; }
    .sym-act.on.vomit { background: var(--vomit); border-color: var(--vomit); }
    .sym-act.on.pant  { background: var(--pant);  border-color: var(--pant); }

    .dose-btn:focus-visible, .sym-act:focus-visible, .cell:focus-visible,
    .today-link:focus-visible, .toast button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Weekday row ── */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 5px;
    }
    .wd {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 3px 0;
    }
    .wd:first-child { color: #D07070; }
    .wd:last-child  { color: #7090D0; }

    /* ── Calendar grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .cell {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 5px 2px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 96px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cell:hover { border-color: #CCC9C4; }

    .cell.empty {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }

    .cell.is-today {
      border-color: var(--accent);
      background: #FEF8F4;
    }

    /* 過去、起始日之後、有一餐沒記錄 → 淡橘底，一眼看出漏記 */
    .cell.is-missed {
      background: var(--missed-bg);
      border-color: var(--missed-border);
    }

    /* 未來的日子：只淡化圖示，日期數字維持可讀 */
    .cell.is-future .cat-icon  { opacity: 0.45; }
    .cell.is-future .sym-dot   { opacity: 0.5; }

    .day-num {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1;
    }
    .cell.is-today .day-num {
      color: var(--accent);
      font-weight: 700;
    }

    .cats {
      display: flex;
      flex-direction: column;
      gap: 1px;
      align-items: center;
    }

    /* 格子內的圖示只負責顯示；操作統一在「今天」卡片與點格子後的面板 */
    .cat-mark { padding: 1px; line-height: 0; }

    .cat-icon { display: block; width: 24px; height: 24px; }

    /* ── Symptom dots ── */
    .syms {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .sym-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--undone);
      display: flex; align-items: center; justify-content: center;
      font-size: 7.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      transition: background 0.15s;
    }
    .sym-vomit { background: var(--vomit); color: white; }
    .sym-pant  { background: var(--pant);  color: white; }

    @media (max-width: 360px) {
      .cat-icon { width: 20px; height: 20px; }
      .cell { min-height: 84px; gap: 1px; }
      .sym-dot { width: 16px; height: 16px; font-size: 6.5px; }
    }

    /* ── Legend ── */
    /* 6 個項目要排進同一行：圖示縮小、間距收窄、文字不換行。
       極窄螢幕（≤340px）改成 3×2 的整齊兩排，避免單一項目落單 */
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      padding: 12px 0 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .legend-item .cat-icon { width: 20px; height: 20px; }
    .legend-dot {
      width: 16px; height: 16px;
      font-size: 7.5px;
      display: inline-flex;
    }
    .legend-missed {
      width: 14px; height: 14px;
      border-radius: 4px;
      background: var(--missed-bg);
      border: 1.5px solid var(--missed-border);
    }
    @media (max-width: 340px) {
      .legend { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 8px 14px; }
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      margin-top: 10px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sync-info {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      flex: 1;
    }
    .sync-dot {
      flex-shrink: 0;
      width: 8px; height: 8px;
      margin-top: 0.42em;
      border-radius: 50%;
      background: var(--undone);
    }
    .sync-dot.ok   { background: var(--ok); }
    .sync-dot.err  { background: var(--err); }
    .sync-dot.busy { background: var(--accent); }
    .sync-info.err { color: var(--err); }

    .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .refresh-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: var(--border); color: var(--text); }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .setup-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .setup-btn:hover { opacity: 0.82; }

    /* ── Overlay / bottom sheet ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 18px 22px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .sheet h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-input {
      display: block;
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s, background 0.15s;
    }
    .field-input:focus { border-color: var(--accent); background: white; }

    .steps {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .steps-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .steps ol {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .steps li {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .steps b { color: var(--text); }
    .steps code {
      background: #E6E2DB;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: monospace;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .btn-cancel {
      flex: 1;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #DDD9D3; }
    .btn-save {
      flex: 2;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }

    /* ── Toast（記錄後的回饋＋復原） ── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      max-width: calc(100% - 28px);
      background: #2C2C2C;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 8px 8px 8px 16px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 60;
    }
    .toast.show { opacity: 1; pointer-events: all; transform: translate(-50%, 0); }
    .toast button {
      background: none;
      border: none;
      color: #F2C9B0;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 10px;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="cat-name" id="catName" onclick="openSetup()" title="點擊設定">
      <span id="catNameText">小貓咪</span>
    </div>
    <div class="header-sub">每日餵藥記錄</div>
  </div>

  <div class="today" id="today"></div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)" aria-label="上個月">‹</button>
    <div class="month-center">
      <div class="month-label" id="monthLabel"></div>
      <button class="today-link" id="todayLink" onclick="goToday()">回到今天</button>
    </div>
    <button class="nav-btn" onclick="changeMonth(1)" aria-label="下個月">›</button>
  </div>

  <div class="weekdays">
    <div class="wd">日</div>
    <div class="wd">一</div>
    <div class="wd">二</div>
    <div class="wd">三</div>
    <div class="wd">四</div>
    <div class="wd">五</div>
    <div class="wd">六</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>

  <div class="bottom-bar">
    <div class="sync-info" id="syncInfo" role="status" aria-live="polite">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">尚未設定同步</span>
    </div>
    <div class="bar-actions">
      <button class="refresh-btn" id="refreshBtn" onclick="syncAll()" title="重新同步">↻</button>
      <button class="setup-btn" onclick="openSetup()">設定</button>
    </div>
  </div>

</div>

<!-- 某一天的紀錄面板（點月曆格子打開） -->
<div class="overlay" id="dayOverlay" onclick="dayBg(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="dayTitle"></h2>
    <div id="dayBody"></div>
    <div class="sheet-actions" style="margin-top:18px">
      <button class="btn-save" onclick="closeDay()">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo" onclick="undoLast()">復原</button>
</div>

<!-- Bottom sheet -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2>設定</h2>

    <label class="field-label" for="inputName">貓咪名字</label>
    <input class="field-input" type="text" id="inputName" placeholder="例：橘子、豆豆、咪咪" maxlength="20">

    <label class="field-label" for="inputUrl">Google Drive 同步網址（選填）</label>
    <input class="field-input" type="url" id="inputUrl" placeholder="https://script.google.com/macros/s/…/exec">

    <div class="steps">
      <div class="steps-title">如何設定 Google Drive 同步</div>
      <ol>
        <li>到 <b>Google Drive</b> 新增一個 Google 試算表</li>
        <li>開啟試算表，點「<b>擴充功能</b>」→「<b>Apps Script</b>」</li>
        <li>清空編輯器，貼上 <code>apps-script.gs</code> 的程式碼並儲存</li>
        <li>點「<b>部署</b>」→「<b>新增部署作業</b>」→ 類型選「<b>網頁應用程式</b>」</li>
        <li>執行身分：<b>我</b>，存取權：<b>所有人</b>，按「<b>部署</b>」並授權</li>
        <li>複製產生的「<b>網頁應用程式網址</b>」貼到上方欄位</li>
        <li>把這個網頁的網址傳給家人，他們同樣在這裡貼上同步網址即可共用</li>
      </ol>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSetup()">取消</button>
      <button class="btn-save" onclick="saveSetup()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
var C_UNDONE = '#C4C0BA';   // 與 CSS 的 --undone / --am / --pm 保持一致
var C_AM     = '#C97C00';
var C_PM     = '#6573C0';

var PERIOD_LABEL = { am: '早上餵藥', pm: '晚上餵藥', vomit: '嘔吐', pant: '喘氣' };
var WEEKDAYS     = ['日','一','二','三','四','五','六'];

// ── State ─────────────────────────────────────────────────────────────────────
var curYear, curMonth;
var records   = {};   // { 'YYYY-MM-DD': { am, pm, vomit, pant } }
var pending   = {};   // 還沒被 server 確認的本地修改：{ 'YYYY-MM-DD|period': bool }
var scriptUrl = '';
var catName   = '小貓咪';
var openDayKey = null;

// ── Cat SVG ───────────────────────────────────────────────────────────────────
function catSVG(color) {
  // Two ear triangles + circular head; eyes + nose drawn on top
  var e = 'rgba(255,255,255,0.6)'; // eye whites
  var p = 'rgba(0,0,0,0.28)';      // pupils
  var n = 'rgba(0,0,0,0.18)';      // nose
  var m = 'rgba(0,0,0,0.12)';      // mouth
  return [
    '<svg class="cat-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">',
    // Left ear
    '<polygon points="3,18 10,5 16,18" fill="',color,'"/>',
    // Right ear
    '<polygon points="16,18 22,5 29,18" fill="',color,'"/>',
    // Head
    '<circle cx="16" cy="22" r="11" fill="',color,'"/>',
    // Left eye white
    '<ellipse cx="12" cy="20" rx="2.2" ry="2.6" fill="',e,'"/>',
    // Right eye white
    '<ellipse cx="20" cy="20" rx="2.2" ry="2.6" fill="',e,'"/>',
    // Left pupil
    '<ellipse cx="12" cy="20.6" rx="1.1" ry="1.7" fill="',p,'"/>',
    // Right pupil
    '<ellipse cx="20" cy="20.6" rx="1.1" ry="1.7" fill="',p,'"/>',
    // Nose triangle
    '<path d="M14.8 24.5 L17.2 24.5 L16 26.2 Z" fill="',n,'"/>',
    // Smile
    '<path d="M14.2 27 Q16 28.8 17.8 27" stroke="',m,'" stroke-width="0.9" fill="none" stroke-linecap="round"/>',
    '</svg>'
  ].join('');
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }

function toKey(y, m, d) {
  return y + '-' + pad(m+1) + '-' + pad(d);
}

function nowKey() {
  var t = new Date();
  return toKey(t.getFullYear(), t.getMonth(), t.getDate());
}

// 'YYYY-MM-DD' → '10月6日（二）'
function dateLabel(key) {
  var p = key.split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEKDAYS[d.getDay()] + '）';
}

// 有紀錄以來的第一天；在這之前的日子不算「漏記」
function firstRecordKey() {
  var first = null;
  for (var k in records) {
    if ((records[k].am || records[k].pm) && (!first || k < first)) first = k;
  }
  return first;
}

// ── Render calendar ───────────────────────────────────────────────────────────
var MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function render() {
  document.getElementById('monthLabel').textContent = curYear + ' 年 ' + MONTH_NAMES[curMonth];

  var today    = nowKey();
  var firstRec = firstRecordKey();
  var firstDow = new Date(curYear, curMonth, 1).getDay();
  var days     = new Date(curYear, curMonth + 1, 0).getDate();
  var html = '';

  for (var i = 0; i < firstDow; i++) {
    html += '<div class="cell empty"></div>';
  }

  for (var d = 1; d <= days; d++) {
    var key  = toKey(curYear, curMonth, d);
    var rec     = records[key] || {};
    var amOk    = !!rec.am;
    var pmOk    = !!rec.pm;
    var vomitOk = !!rec.vomit;
    var pantOk  = !!rec.pant;
    var cls  = 'cell';
    if (key === today) cls += ' is-today';
    if (key > today)   cls += ' is-future';
    if (key < today && firstRec && key >= firstRec && !(amOk && pmOk)) cls += ' is-missed';

    var label = dateLabel(key) + '，早上' + (amOk ? '已餵' : '沒有記錄') + '，晚上' + (pmOk ? '已餵' : '沒有記錄') +
                (vomitOk ? '，有嘔吐' : '') + (pantOk ? '，有喘氣' : '');

    html += '<div class="' + cls + '" role="button" tabindex="0" aria-label="' + label + '"' +
            ' onclick="openDay(\'' + key + '\')" onkeydown="cellKey(event,\'' + key + '\')">';
    html += '<span class="day-num">' + d + '</span>';
    html += '<div class="cats">';
    html += '<span class="cat-mark">' + catSVG(amOk ? C_AM : C_UNDONE) + '</span>';
    html += '<span class="cat-mark">' + catSVG(pmOk ? C_PM : C_UNDONE) + '</span>';
    html += '</div>';
    html += '<div class="syms">';
    html += '<div class="sym-dot' + (vomitOk ? ' sym-vomit' : '') + '">吐</div>';
    html += '<div class="sym-dot' + (pantOk ? ' sym-pant' : '') + '">喘</div>';
    html += '</div>';
    html += '</div>';
  }

  document.getElementById('grid').innerHTML = html;

  // 不在當月時，顯示「回到今天」
  var t = new Date();
  var onThisMonth = (curYear === t.getFullYear() && curMonth === t.getMonth());
  document.getElementById('todayLink').classList.toggle('show', !onThisMonth);

  // Legend
  document.getElementById('legend').innerHTML =
    '<div class="legend-item">' + catSVG(C_AM) + '<span>早上</span></div>' +
    '<div class="legend-item">' + catSVG(C_PM) + '<span>晚上</span></div>' +
    '<div class="legend-item">' + catSVG(C_UNDONE) + '<span>未餵</span></div>' +
    '<div class="legend-item"><div class="sym-dot sym-vomit legend-dot">吐</div><span>嘔吐</span></div>' +
    '<div class="legend-item"><div class="sym-dot sym-pant legend-dot">喘</div><span>喘氣</span></div>' +
    '<div class="legend-item"><span class="legend-missed"></span><span>漏記</span></div>';
}

// 「今天」卡片與「某一天」面板共用同一組控制按鈕
function dayControls(key) {
  var rec  = records[key] || {};
  var past = key < nowKey();
  var none = past ? '沒有記錄' : '還沒餵';

  function dose(period, label, color) {
    var on = !!rec[period];
    return '<button class="dose-btn ' + period + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
           ' onclick="toggle(\'' + key + '\',\'' + period + '\')">' +
           catSVG(on ? color : C_UNDONE) +
           '<span class="dose-label">' + label + '</span>' +
           '<span class="dose-state">' + (on ? '已餵 ✓' : none) + '</span></button>';
  }
  function sym(period, label) {
    var on = !!rec[period];
    return '<button class="sym-act ' + period + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
           ' onclick="toggle(\'' + key + '\',\'' + period + '\')">' + (on ? '✓ 有' + label : label) + '</button>';
  }

  return '<div class="doses">' + dose('am', '早上', C_AM) + dose('pm', '晚上', C_PM) + '</div>' +
         '<div class="symacts">' + sym('vomit', '嘔吐') + sym('pant', '喘氣') + '</div>';
}

function renderToday() {
  var key = nowKey();
  document.getElementById('today').innerHTML =
    '<div class="today-head"><span class="today-title">今天</span>' +
    '<span class="today-date">' + dateLabel(key) + '</span></div>' + dayControls(key);
}

function renderAll() {
  render();
  renderToday();
  if (openDayKey) renderDay();
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

function goToday() {
  var t = new Date();
  curYear = t.getFullYear();
  curMonth = t.getMonth();
  render();
}

// ── 某一天的面板 ──────────────────────────────────────────────────────────────
function openDay(key) {
  openDayKey = key;
  renderDay();
  document.getElementById('dayOverlay').classList.add('open');
}

function renderDay() {
  document.getElementById('dayTitle').textContent = dateLabel(openDayKey);
  document.getElementById('dayBody').innerHTML = dayControls(openDayKey);
}

function closeDay() {
  openDayKey = null;
  document.getElementById('dayOverlay').classList.remove('open');
}

function dayBg(e) {
  if (e.target === document.getElementById('dayOverlay')) closeDay();
}

function cellKey(e, key) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDay(key); }
}

// ── Toast：記錄後的回饋，附復原 ───────────────────────────────────────────────
var toastTimer = null;
var undoAction = null;

function showToast(msg, undo) {
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastUndo').style.display = undo ? '' : 'none';
  undoAction = undo || null;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4500);
}

function hideToast() {
  document.getElementById('toast').classList.remove('show');
  undoAction = null;
}

function undoLast() {
  var fn = undoAction;
  hideToast();
  if (fn) fn();
}

// ── Toggle ────────────────────────────────────────────────────────────────────
function toggle(key, period, silent) {
  if (!records[key]) records[key] = { am: false, pm: false, vomit: false, pant: false };
  var value = !records[key][period];
  records[key][period] = value;
  saveLocal();
  renderAll();

  if (!silent) {
    var when = key === nowKey() ? '' : dateLabel(key).split('（')[0] + ' ';
    showToast((value ? '已記錄　' : '已取消　') + when + PERIOD_LABEL[period], function() {
      toggle(key, period, true);
    });
  }

  if (scriptUrl) {
    // 先記成「待確認」，推送成功才清掉；中途同步或離線都不會讓這筆消失
    pending[key + '|' + period] = value;
    savePending();
    pushToggle(key, period, value);
  }
}

function saveLocal() {
  try { localStorage.setItem('catMedRec', JSON.stringify(records)); } catch(e) {}
}

function savePending() {
  try { localStorage.setItem('catMedPending', JSON.stringify(pending)); } catch(e) {}
}

// ── Sync ──────────────────────────────────────────────────────────────────────
// kind：'ok' 已同步／'err' 失敗／'busy' 進行中／省略 = 中性
function setStatus(msg, kind) {
  document.getElementById('syncText').textContent = msg;
  document.getElementById('syncDot').className  = 'sync-dot' + (kind ? ' ' + kind : '');
  document.getElementById('syncInfo').className = 'sync-info' + (kind === 'err' ? ' err' : '');
}

function spinning(on) {
  var btn = document.getElementById('refreshBtn');
  if (on) btn.classList.add('spinning');
  else    btn.classList.remove('spinning');
}

// JSONP 方式讀取資料，解決手機瀏覽器（尤其 iOS Safari）的 CORS 限制
function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    var cbName = '_catcb' + Date.now() + Math.floor(Math.random() * 9999);
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      cleanup();
      reject(new Error('timeout'));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('script load error'));
    };

    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

var pushCount  = 0;                  // 還在排隊或進行中的寫入數量
var pushQueue  = Promise.resolve();  // 寫入依點擊順序一筆一筆送，避免先後順序錯亂
var syncing    = false;
var syncAgain  = false;

function setUrl(key, period, value) {
  return scriptUrl + '?action=set&date=' + key + '&period=' + period + '&value=' + (value ? '1' : '0');
}

// 把還沒被 server 確認的本地修改，蓋回剛從 server 拿到的資料上
function applyPending() {
  for (var pk in pending) {
    var parts = pk.split('|');
    if (!records[parts[0]]) records[parts[0]] = { am: false, pm: false, vomit: false, pant: false };
    records[parts[0]][parts[1]] = pending[pk];
  }
}

// 補送之前沒送成功的修改（例如當時沒網路）；送不出去就留著，下次再試
async function flushPending() {
  var keys = Object.keys(pending);
  for (var i = 0; i < keys.length; i++) {
    var pk = keys[i], v = pending[pk], parts = pk.split('|');
    try {
      var res = await jsonpFetch(setUrl(parts[0], parts[1], v));
      if (res && res.ok && pending[pk] === v) delete pending[pk];
    } catch(e) { break; }
  }
  savePending();
}

function syncFailMessage(e) {
  if (!navigator.onLine) return '沒有網路。紀錄已存在手機，連線後會自動補上傳';
  if (e && String(e.message).indexOf('server:') === 0) return '試算表回傳錯誤（' + e.message.slice(7) + '），請到設定確認網址';
  return '連不上 Google 試算表，網址或權限可能失效。紀錄已存在手機，點 ↻ 重試';
}

async function syncAll() {
  if (!scriptUrl) { setStatus('尚未設定同步網址'); return; }
  if (pushCount > 0) { setStatus('寫入中，完成後自動同步…', 'busy'); return; }
  if (syncing) { syncAgain = true; return; }   // 同步進行中又被要求同步 → 結束後再跑一次
  syncing = true;
  spinning(true);
  setStatus('同步中…', 'busy');
  try {
    await flushPending();
    var serverData = await jsonpFetch(scriptUrl + '?action=getAll');
    if (!serverData || typeof serverData !== 'object' || serverData.error) {
      throw new Error('server:' + (serverData && serverData.error ? serverData.error : '格式不正確'));
    }

    // 第一次同步：server 是空的但本地有資料 → 把本地資料推上去
    var serverEmpty = Object.keys(serverData).length === 0;
    var localKeys = Object.keys(records);
    if (serverEmpty && localKeys.length > 0) {
      setStatus('上傳本地資料…', 'busy');
      for (var i = 0; i < localKeys.length; i++) {
        var k = localKeys[i];
        var rec = records[k];
        if (rec.am)    await pushOne(k, 'am', true);
        if (rec.pm)    await pushOne(k, 'pm', true);
        if (rec.vomit) await pushOne(k, 'vomit', true);
        if (rec.pant)  await pushOne(k, 'pant', true);
      }
      serverData = await jsonpFetch(scriptUrl + '?action=getAll');
      if (!serverData || typeof serverData !== 'object' || serverData.error) {
        throw new Error('server:' + (serverData && serverData.error ? serverData.error : '格式不正確'));
      }
    }

    // 以 server 為準，再把尚未確認的本地修改蓋回去
    records = {};
    for (var key in serverData) {
      records[key] = {
        am:    !!serverData[key].am,
        pm:    !!serverData[key].pm,
        vomit: !!serverData[key].vomit,
        pant:  !!serverData[key].pant
      };
    }
    applyPending();
    saveLocal();
    renderAll();

    var left = Object.keys(pending).length;
    if (left > 0) {
      setStatus(left + ' 筆紀錄尚未上傳，稍後自動重試', 'err');
    } else {
      var t = new Date();
      setStatus('已同步  ' + pad(t.getHours()) + ':' + pad(t.getMinutes()), 'ok');
    }
  } catch(e) {
    setStatus(syncFailMessage(e), 'err');
  }
  spinning(false);
  syncing = false;
  if (syncAgain) { syncAgain = false; syncAll(); }
}

async function pushOne(key, period, value) {
  try {
    await jsonpFetch(setUrl(key, period, value));
  } catch(e) {}
}

function pushToggle(key, period, value) {
  pushCount++;
  setStatus('寫入中…', 'busy');
  pushQueue = pushQueue.then(function() { return doPush(key, period, value); });
}

async function doPush(key, period, value) {
  var pk = key + '|' + period;
  var success = false;
  for (var i = 0; i < 3; i++) {
    try {
      var res = await jsonpFetch(setUrl(key, period, value));
      if (res && res.ok) { success = true; break; }
    } catch(e) {}
    if (i < 2) await new Promise(function(r){ setTimeout(r, 1500); });
  }
  pushCount--;

  if (success) {
    if (pending[pk] === value) { delete pending[pk]; savePending(); }   // 之後又改過就保留新的
    // 全部寫完後，從 server 確認一次，確保資料一致
    if (pushCount === 0) await syncAll();
  } else {
    // 寫入失敗：保留畫面上的狀態與待確認紀錄，連線恢復後自動補上傳
    if (pushCount === 0) {
      setStatus(navigator.onLine
        ? '寫入失敗，紀錄已存在手機，稍後自動重試'
        : '沒有網路。紀錄已存在手機，連線後會自動補上傳', 'err');
    }
  }
}

// ── Setup sheet ───────────────────────────────────────────────────────────────
function openSetup() {
  document.getElementById('inputName').value = catName;
  document.getElementById('inputUrl').value  = scriptUrl;
  document.getElementById('overlay').classList.add('open');
}

function closeSetup() {
  document.getElementById('overlay').classList.remove('open');
}

function overlayBg(e) {
  if (e.target === document.getElementById('overlay')) closeSetup();
}

function saveSetup() {
  var name = document.getElementById('inputName').value.trim();
  var url  = document.getElementById('inputUrl').value.trim();

  catName   = name || '小貓咪';
  scriptUrl = url;

  document.getElementById('catNameText').textContent = catName;

  try {
    localStorage.setItem('catMedName', catName);
    localStorage.setItem('catMedUrl',  scriptUrl);
  } catch(e) {}

  closeSetup();

  if (scriptUrl) {
    syncAll();
  } else {
    setStatus('尚未設定同步網址');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  var now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth();

  try {
    var saved = localStorage.getItem('catMedRec');
    records   = saved ? JSON.parse(saved) : {};
    catName   = localStorage.getItem('catMedName') || '小貓咪';
    scriptUrl = localStorage.getItem('catMedUrl')  || '';
    var savedPending = localStorage.getItem('catMedPending');
    pending = savedPending ? JSON.parse(savedPending) : {};
  } catch(e) { records = {}; pending = {}; }

  document.getElementById('catNameText').textContent = catName;
  renderAll();

  if (scriptUrl) {
    setStatus('連線中…', 'busy');
    syncAll();
  }

  // 切回 app、或網路恢復時自動同步（同時會補上傳先前沒送成功的紀錄）
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && scriptUrl) syncAll();
  });
  window.addEventListener('online', function() { if (scriptUrl) syncAll(); });

  // Esc 關閉面板
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    closeDay();
    closeSetup();
  });

  // 跨日時（App 一直開著）自動更新「今天」
  var shownDay = nowKey();
  setInterval(function() {
    if (nowKey() !== shownDay) { shownDay = nowKey(); renderAll(); }
  }, 60000);
})();
</script>
